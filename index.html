<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DRIFTBREAKER — 60s Space Run</title>
<style>
/* ============================================================
   DRIFTBREAKER — SUPER LOVE-DOVEY EDITION 💗
   Complete replacement for the original <style> block.

   Matched to the EXISTING HTML:
   #driftbreaker-root
   #gameCanvas
   #hud
   #hudLives
   #hudScore
   #introOverlay
   #endOverlay
   #tapToPlay
   #retryBtn
   #proceedBtn
   #bossHud
   #bossHealth
   #flash

   No JavaScript changes required.
   ============================================================ */

:root{
  /* ==========================================================
     ROMANTIC PALETTE
     ========================================================== */

  --void-0:#170710;
  --void-1:#250b18;
  --void-2:#3b1027;

  --rose-deep:#8f174f;
  --rose:#e83f83;
  --pink:#ff6fae;
  --blush:#ffb6cf;
  --baby:#ffd9e7;

  --lavender:#c89cff;
  --lavender-soft:#ead7ff;

  --gold:#ffd98a;
  --gold-soft:#ffe9b8;

  --ink-0:#fff8fb;
  --ink-1:#e7bccc;

  --font-display:'Quicksand','Chakra Petch','Segoe UI',system-ui,sans-serif;
  --font-mono:'Space Mono','Courier New',monospace;

  --pink-glow:
    0 0 8px rgba(255,111,174,.7),
    0 0 22px rgba(255,72,143,.35);

  --soft-glow:
    0 0 12px rgba(255,182,207,.55),
    0 0 30px rgba(255,91,156,.18);

  --glass:
    rgba(255,255,255,.045);
}


/* ============================================================
   BASE
   ============================================================ */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  height:100%;
  background:#10040a;
}

body{
  font-family:var(--font-display);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:var(--ink-0);
  height:100dvh;

  background:
    radial-gradient(
      circle at 18% 18%,
      rgba(255,105,174,.16),
      transparent 34%
    ),
    radial-gradient(
      circle at 84% 75%,
      rgba(200,156,255,.11),
      transparent 34%
    ),
    radial-gradient(
      circle at 50% 110%,
      rgba(255,61,131,.12),
      transparent 42%
    ),
    #10040a;
}


/* ============================================================
   GAME FRAME
   ============================================================ */

#driftbreaker-root{
  position:relative;

  width:min(
    520px,
    100vw,
    calc(100dvh * 9 / 16)
  );

  aspect-ratio:9/16;

  overflow:hidden;

  border-radius:24px;

  background:
    radial-gradient(
      ellipse at 25% 12%,
      rgba(255,91,156,.30),
      transparent 52%
    ),
    radial-gradient(
      ellipse at 82% 38%,
      rgba(200,156,255,.14),
      transparent 42%
    ),
    radial-gradient(
      ellipse at 70% 90%,
      rgba(255,182,207,.15),
      transparent 48%
    ),
    linear-gradient(
      180deg,
      #321021 0%,
      #210914 45%,
      #13050c 100%
    );

  border:1px solid rgba(255,182,207,.20);

  box-shadow:
    0 0 0 1px rgba(255,255,255,.025),
    0 0 30px rgba(255,72,143,.20),
    0 25px 90px rgba(0,0,0,.75),
    inset 0 0 90px rgba(255,105,174,.07);

  user-select:none;
  touch-action:none;

  container-type:inline-size;
}


/* ============================================================
   ROMANTIC ATMOSPHERE LAYERS
   ============================================================ */

#driftbreaker-root::before{
  content:"";

  position:absolute;
  inset:-20%;

  pointer-events:none;

  z-index:1;

  background:
    radial-gradient(
      circle at 20% 25%,
      rgba(255,150,190,.12) 0 2px,
      transparent 3px
    ),
    radial-gradient(
      circle at 70% 18%,
      rgba(255,220,235,.15) 0 1.5px,
      transparent 3px
    ),
    radial-gradient(
      circle at 82% 58%,
      rgba(255,120,177,.13) 0 2px,
      transparent 3px
    ),
    radial-gradient(
      circle at 30% 80%,
      rgba(221,176,255,.12) 0 2px,
      transparent 3px
    );

  background-size:
    170px 190px,
    210px 230px,
    250px 270px,
    190px 220px;

  opacity:.75;

  animation:
    dreamyDrift 18s ease-in-out infinite alternate;
}


#driftbreaker-root::after{
  content:"♥   ♡       ♥        ♡   ♥";

  position:absolute;
  inset:0;

  pointer-events:none;

  z-index:2;

  color:rgba(255,182,207,.12);

  font-size:clamp(16px,4.5cqw,26px);

  letter-spacing:1.8em;

  line-height:7;

  text-align:center;

  white-space:normal;

  overflow:hidden;

  transform:rotate(-7deg);

  filter:
    blur(.1px)
    drop-shadow(0 0 8px rgba(255,91,156,.3));

  animation:
    heartFloat 12s ease-in-out infinite;
}


/* ============================================================
   CANVAS
   ============================================================ */

canvas#gameCanvas{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;

  z-index:3;

  filter:
    drop-shadow(
      0 0 35px rgba(255,91,156,.12)
    );
}


/* ============================================================
   HUD
   ============================================================ */

#hud{
  position:absolute;

  top:0;
  left:0;
  right:0;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  padding:
    max(16px,env(safe-area-inset-top))
    18px
    0;

  pointer-events:none;

  opacity:0;

  transition:
    opacity .45s ease,
    transform .45s ease;

  z-index:20;
}

#hud.visible{
  opacity:1;
}

.hud-block{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.hud-label{
  font-family:var(--font-mono);

  font-size:8px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:rgba(255,213,226,.72);

  text-shadow:
    0 0 8px rgba(255,105,174,.4);
}

.hud-value{
  font-size:20px;

  font-weight:800;

  letter-spacing:.03em;

  color:var(--ink-0);

  text-shadow:
    0 0 10px rgba(255,182,207,.45),
    0 0 25px rgba(255,72,143,.25);
}

#hud .score .hud-value{
  color:#ffd7e7;

  text-align:right;

  text-shadow:
    0 0 10px rgba(255,111,174,.75),
    0 0 28px rgba(255,72,143,.30);
}

#hud .lives{
  align-items:flex-start;
}


/* ============================================================
   HEART LIVES
   ============================================================ */

.life-dot{
  display:inline-flex;

  position:relative;

  width:16px;
  height:16px;

  margin-left:3px;

  align-items:center;
  justify-content:center;

  background:none;

  border:0;

  color:var(--pink);

  font-size:16px;

  line-height:1;

  text-shadow:
    0 0 6px rgba(255,72,143,.85),
    0 0 14px rgba(255,72,143,.5);

  filter:
    drop-shadow(
      0 0 4px rgba(255,72,143,.55)
    );

  animation:
    tinyHeartBeat 2.2s ease-in-out infinite;
}

.life-dot::before{
  content:"♥";
}

.life-dot:nth-child(2){
  animation-delay:.15s;
}

.life-dot:nth-child(3){
  animation-delay:.3s;
}

.life-dot.spent{
  color:rgba(255,205,221,.18);

  text-shadow:none;

  filter:none;

  animation:none;
}

.life-dot.spent::before{
  content:"♡";
}


/* ============================================================
   INTRO / END OVERLAYS
   ============================================================ */

.overlay{
  position:absolute;
  inset:0;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:32px;

  z-index:30;

  background:
    radial-gradient(
      ellipse at 50% 25%,
      rgba(255,105,174,.22),
      transparent 48%
    ),
    radial-gradient(
      ellipse at 15% 85%,
      rgba(255,182,207,.12),
      transparent 40%
    ),
    radial-gradient(
      ellipse at 90% 70%,
      rgba(200,156,255,.12),
      transparent 40%
    ),
    rgba(20,4,12,.72);

  backdrop-filter:blur(8px);

  -webkit-backdrop-filter:blur(8px);

  transition:
    opacity .45s ease,
    visibility .45s ease;
}

.overlay::before{
  content:"";

  position:absolute;

  width:65%;
  height:30%;

  top:8%;

  background:
    radial-gradient(
      ellipse,
      rgba(255,111,174,.16),
      transparent 70%
    );

  filter:blur(25px);

  pointer-events:none;

  animation:
    romanticGlow 4s ease-in-out infinite;
}

.overlay.hidden{
  opacity:0;

  visibility:hidden;

  pointer-events:none;
}


/* ============================================================
   EYEBROW
   ============================================================ */

.eyebrow{
  position:relative;

  font-family:var(--font-mono);

  font-size:
    clamp(
      9px,
      3cqw,
      12px
    );

  letter-spacing:.30em;

  text-transform:uppercase;

  color:#ffb8d0;

  margin-bottom:11px;

  text-shadow:
    0 0 8px rgba(255,111,174,.65),
    0 0 18px rgba(255,72,143,.25);

  animation:
    softHeartbeat 2.8s ease-in-out infinite;
}

.eyebrow::before{
  content:"♡";

  display:inline-block;

  margin-right:8px;

  color:#ff79ad;

  animation:
    tinyHeartBeat 1.8s ease-in-out infinite;
}

.eyebrow::after{
  content:"♡";

  display:inline-block;

  margin-left:8px;

  color:#ff79ad;
}


/* ============================================================
   MAIN TITLE
   ============================================================ */

.title{
  position:relative;

  margin:0 0 10px;

  font-size:
    clamp(
      30px,
      10cqw,
      46px
    );

  font-weight:800;

  line-height:1.02;

  letter-spacing:.015em;

  background:
    linear-gradient(
      135deg,
      #fff9fc 0%,
      #ffe3ed 25%,
      #ff9ec3 55%,
      #ff5d9c 78%,
      #e83f83 100%
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  text-shadow:none;

  filter:
    drop-shadow(
      0 5px 18px rgba(255,72,143,.22)
    );

  animation:
    titleGlow 3.5s ease-in-out infinite;
}


/* decorative heart behind title */

.title::after{
  content:"♥";

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(2.2);

  color:rgba(255,72,143,.045);

  z-index:-1;

  pointer-events:none;

  filter:
    blur(2px);
}


/* ============================================================
   SUBTEXT
   ============================================================ */

.sub{
  font-family:var(--font-mono);

  font-size:
    clamp(
      10px,
      3.2cqw,
      13px
    );

  color:#e8bdce;

  max-width:88%;

  line-height:1.75;

  margin-bottom:28px;

  letter-spacing:.015em;

  text-shadow:
    0 1px 8px rgba(0,0,0,.5);
}


/* ============================================================
   TAP TO PLAY
   ============================================================ */

.tap-pulse{
  position:relative;

  display:inline-flex;

  align-items:center;

  gap:9px;

  padding:14px 29px;

  border-radius:100px;

  border:1px solid rgba(255,182,207,.65);

  background:
    linear-gradient(
      135deg,
      rgba(255,111,174,.25),
      rgba(232,63,131,.16)
    );

  color:#ffe9f1;

  font-family:var(--font-mono);

  font-size:12px;

  letter-spacing:.16em;

  text-transform:uppercase;

  cursor:pointer;

  box-shadow:
    0 0 0 1px rgba(255,255,255,.035),
    0 0 18px rgba(255,72,143,.28),
    0 10px 30px rgba(255,20,100,.15);

  backdrop-filter:blur(10px);

  -webkit-backdrop-filter:blur(10px);

  animation:
    loveButtonPulse 2.1s ease-in-out infinite;

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}

.tap-pulse::before{
  content:"♡";

  font-size:16px;

  color:#ffb8d0;

  text-shadow:
    0 0 10px rgba(255,105,174,.7);

  animation:
    tinyHeartBeat 1.7s ease-in-out infinite;
}

.tap-pulse::after{
  content:"♡";

  font-size:16px;

  color:#ffb8d0;

  text-shadow:
    0 0 10px rgba(255,105,174,.7);

  animation:
    tinyHeartBeat 1.7s ease-in-out infinite;

  animation-delay:.3s;
}

.tap-pulse:hover{
  transform:translateY(-2px) scale(1.025);

  background:
    linear-gradient(
      135deg,
      rgba(255,111,174,.38),
      rgba(232,63,131,.28)
    );

  box-shadow:
    0 0 25px rgba(255,72,143,.45),
    0 12px 35px rgba(255,20,100,.20);
}

.tap-pulse:active{
  transform:scale(.96);
}


/* ============================================================
   STATS
   ============================================================ */

.stat-row{
  display:flex;

  gap:34px;

  margin:7px 0 25px;
}

.stat{
  display:flex;

  flex-direction:column;

  align-items:center;
}

.stat .n{
  font-size:29px;

  font-weight:800;

  color:#fff4f8;

  text-shadow:
    0 0 15px rgba(255,105,174,.25);
}

.stat .n.best{
  color:var(--gold);

  text-shadow:
    0 0 12px rgba(255,217,138,.45);
}

.stat .l{
  font-family:var(--font-mono);

  font-size:8px;

  letter-spacing:.18em;

  color:#d9aebe;

  text-transform:uppercase;

  margin-top:4px;
}


/* ============================================================
   RETRY / PROCEED BUTTON
   ============================================================ */

.retry-btn{
  position:relative;

  padding:13px 34px;

  border-radius:100px;

  border:1px solid rgba(255,225,235,.35);

  background:
    linear-gradient(
      135deg,
      #ff76ad,
      #ed3d82
    );

  color:#fff8fb;

  font-family:var(--font-display);

  font-weight:800;

  font-size:14px;

  letter-spacing:.05em;

  cursor:pointer;

  box-shadow:
    0 8px 25px rgba(232,63,131,.30),
    0 0 20px rgba(255,105,174,.20);

  transition:
    transform .16s ease,
    box-shadow .16s ease;
}

.retry-btn::before{
  content:"♥";

  margin-right:7px;

  font-size:12px;
}

.retry-btn:hover{
  transform:
    translateY(-2px)
    scale(1.025);

  box-shadow:
    0 12px 32px rgba(232,63,131,.40),
    0 0 28px rgba(255,105,174,.32);
}

.retry-btn:active{
  transform:scale(.96);
}


/* ============================================================
   VICTORY COPY
   ============================================================ */

.victory-copy{
  font-family:var(--font-mono);

  font-size:
    clamp(
      10px,
      3.3cqw,
      13px
    );

  color:#e8bdce;

  max-width:90%;

  line-height:1.75;

  margin:-7px 0 20px;
}

.victory-copy strong{
  color:#ff9fc2;

  font-weight:700;

  text-shadow:
    0 0 10px rgba(255,105,174,.35);
}


/* ============================================================
   UNLOCK MESSAGE
   ============================================================ */

.unlock-note{
  margin-top:14px;

  max-width:92%;

  font-family:var(--font-mono);

  font-size:9px;

  line-height:1.75;

  letter-spacing:.04em;

  color:#cfa6b8;
}

.unlock-note strong{
  color:var(--gold);

  text-shadow:
    0 0 9px rgba(255,217,138,.35);
}


/* ============================================================
   BOSS HUD — ROMANTIC FINAL BOSS
   ============================================================ */

#bossHud{
  position:absolute;

  top:0;
  left:0;
  right:0;

  padding:16px 18px 0;

  pointer-events:none;

  opacity:0;

  transform:translateY(-12px);

  transition:
    opacity .45s ease,
    transform .45s ease;

  z-index:22;
}

#bossHud.visible{
  opacity:1;

  transform:translateY(0);
}

.boss-name{
  display:flex;

  justify-content:space-between;

  align-items:center;

  font-family:var(--font-mono);

  font-size:8px;

  letter-spacing:.15em;

  text-transform:uppercase;

  color:#ff8fb9;

  text-shadow:
    0 0 9px rgba(255,72,143,.55);

  margin-bottom:7px;
}

.boss-name::before{
  content:"♡";

  margin-right:5px;

  color:#ffb7cf;
}

.boss-name span:last-child{
  color:#e4b8ca;
}

.boss-bar{
  height:8px;

  border:1px solid rgba(255,111,174,.38);

  background:
    rgba(255,255,255,.045);

  border-radius:99px;

  overflow:hidden;

  box-shadow:
    0 0 15px rgba(255,72,143,.14);
}

#bossHealth{
  width:100%;

  height:100%;

  background:
    linear-gradient(
      90deg,
      #ff4f94,
      #ff82b5,
      #ffd0df
    );

  transform-origin:left center;

  transition:
    transform .12s linear;

  box-shadow:
    0 0 12px rgba(255,72,143,.7);
}


/* ============================================================
   FLASH
   ============================================================ */

#flash{
  position:absolute;

  inset:0;

  background:
    radial-gradient(
      circle,
      rgba(255,235,244,.95),
      rgba(255,105,174,.35),
      transparent 75%
    );

  opacity:0;

  pointer-events:none;

  z-index:50;

  mix-blend-mode:screen;
}


/* ============================================================
   BOTTOM HINT
   ============================================================ */

.hint{
  position:absolute;

  bottom:13px;

  left:0;
  right:0;

  text-align:center;

  font-family:var(--font-mono);

  font-size:8px;

  letter-spacing:.15em;

  color:#c997ad;

  opacity:.55;

  z-index:18;

  text-transform:lowercase;
}

.hint::before{
  content:"♡  ";

  color:#ff7cab;
}

.hint::after{
  content:"  ♡";

  color:#ff7cab;
}


/* ============================================================
   WIN SCREEN EXTRA ROMANCE
   ============================================================ */

#endOverlay:not(.hidden) .title{
  animation:
    victoryGlow 2.5s ease-in-out infinite;
}

#endOverlay:not(.hidden) .eyebrow{
  color:#ffd5e3;
}

#endOverlay:not(.hidden) .eyebrow::before,
#endOverlay:not(.hidden) .eyebrow::after{
  content:"♥";
  color:#ff76ad;
}


/* ============================================================
   ANIMATIONS
   ============================================================ */

@keyframes dreamyDrift{
  0%{
    transform:
      translate3d(0,0,0)
      scale(1);
  }

  50%{
    transform:
      translate3d(12px,-10px,0)
      scale(1.025);
  }

  100%{
    transform:
      translate3d(-8px,8px,0)
      scale(1.01);
  }
}


@keyframes heartFloat{
  0%{
    transform:
      translateY(8px)
      rotate(-7deg);
  }

  50%{
    transform:
      translateY(-14px)
      rotate(-3deg);
  }

  100%{
    transform:
      translateY(8px)
      rotate(-7deg);
  }
}


@keyframes romanticGlow{
  0%,100%{
    opacity:.55;
    transform:scale(.9);
  }

  50%{
    opacity:1;
    transform:scale(1.12);
  }
}


@keyframes titleGlow{
  0%,100%{
    filter:
      drop-shadow(
        0 5px 18px rgba(255,72,143,.18)
      );
  }

  50%{
    filter:
      drop-shadow(
        0 5px 24px rgba(255,72,143,.38)
      );
  }
}


@keyframes victoryGlow{
  0%,100%{
    filter:
      drop-shadow(
        0 5px 18px rgba(255,72,143,.25)
      );
  }

  50%{
    filter:
      drop-shadow(
        0 5px 30px rgba(255,105,174,.55)
      );
  }
}


@keyframes tinyHeartBeat{
  0%,100%{
    transform:scale(1);
  }

  15%{
    transform:scale(1.12);
  }

  30%{
    transform:scale(1);
  }

  45%{
    transform:scale(1.09);
  }

  60%{
    transform:scale(1);
  }
}


@keyframes softHeartbeat{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.035);
  }
}


@keyframes loveButtonPulse{
  0%,100%{
    box-shadow:
      0 0 0 0 rgba(255,105,174,.18),
      0 0 18px rgba(255,72,143,.22),
      0 10px 30px rgba(255,20,100,.12);
  }

  50%{
    box-shadow:
      0 0 0 10px rgba(255,105,174,0),
      0 0 28px rgba(255,72,143,.38),
      0 12px 35px rgba(255,20,100,.18);
  }
}


/* ============================================================
   MOBILE REFINEMENT
   ============================================================ */

@media(max-width:430px){

  #driftbreaker-root{
    border-radius:0;

    border-left:0;
    border-right:0;
  }

  .overlay{
    padding:
      28px
      22px;
  }

  .title{
    font-size:
      clamp(
        29px,
        10cqw,
        42px
      );
  }

  .sub{
    max-width:92%;
  }

  .tap-pulse{
    padding:
      13px 24px;
  }

  .stat-row{
    gap:28px;
  }
}


/* ============================================================
   REDUCED MOTION
   ============================================================ */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<div id="driftbreaker-root">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-block lives">
      <span class="hud-label">Hull</span>
      <span class="hud-value" id="hudLives"></span>
    </div>
    <div class="hud-block score">
      <span class="hud-label">Score</span>
      <span class="hud-value" id="hudScore">0</span>
    </div>
  </div>

  <div id="flash"></div>

  <div id="bossHud">
    <div class="boss-name">
      <span>FINAL BOSS // VOID WARDEN</span>
      <span id="bossHealthText">100%</span>
    </div>
    <div class="boss-bar"><div id="bossHealth"></div></div>
  </div>


  <!-- INTRO -->
  <div class="overlay" id="introOverlay">
    <div class="eyebrow">Sector 7 // Incoming</div>
    <h1 class="title">DRIFTBREAKER</h1>
    <p class="sub">Drag or move to steer. Your cannons fire on their own.<br>Survive the 60-second drift. Every wreck is points.</p>
    <div class="tap-pulse" id="tapToPlay">▶ Tap to Play</div>
  </div>

  <!-- GAME OVER -->
  <div class="overlay hidden" id="endOverlay">
    <div class="eyebrow" id="endEyebrow">Run Complete</div>
    <h1 class="title" id="endTitle">Sector Cleared</h1>
    <div class="stat-row">
      <div class="stat"><span class="n" id="endScore">0</span><span class="l">Score</span></div>
      <div class="stat"><span class="n best" id="endBest">0</span><span class="l">Best (session)</span></div>
    </div>
    <p class="victory-copy" id="victoryCopy"></p>
    <button class="retry-btn" id="retryBtn">Fly Again</button>
    <button class="retry-btn" id="proceedBtn" style="display:none;margin-top:10px;">Proceed to Next Section</button>
    <div class="unlock-note" id="unlockNote"></div>
  </div>

  <div class="hint">move to steer · auto-fire armed</div>
</div>

<script>
/* =================================================================
   DRIFTBREAKER — modular 60s space shooter
   -----------------------------------------------------------------
   This file is intentionally organized into independent modules
   (CONFIG, INPUT, ENTITIES, ENGINE, UI) so any section can be
   lifted out and dropped into a larger codebase/site as-is:

     - CONFIG        tunable numbers, change behaviour with no logic edits
     - Starfield      decorative background layer
     - Input          unifies mouse / touch / keyboard into one API
     - Entities       Player, Bullet, Enemy, Particle — plain classes
     - Game           the state machine + loop (intro -> playing -> end)
     - UI             DOM glue (HUD, overlays) kept separate from canvas logic

   To embed elsewhere: either
     a) <iframe src="space-shooter.html" style="border:0;width:100%;height:100%"></iframe>
     b) or copy the #driftbreaker-root block + this <script> into any
        page — everything is scoped inside the IIFE below and reads
        its own #driftbreaker-root, so it won't collide with the host
        page's globals or styles.
   =================================================================*/
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // CONFIG — the only place you should need to touch to rebalance
  // ---------------------------------------------------------------
  const CONFIG = {
    DURATION_SEC: 60,
    LIVES: 3,

    PLAYER: {
      RADIUS: 14,
      FOLLOW_EASE: 0.22,      // how snappily the ship chases the pointer
      FIRE_COOLDOWN: 0.16,    // seconds between shots
      BULLET_SPEED: 620,
      INVULN_AFTER_HIT: 1.4,
    },

    ENEMY: {
      BASE_SPAWN_INTERVAL: 1.05,   // seconds, gets faster over time
      MIN_SPAWN_INTERVAL: 0.35,
      SPEED_MIN: 90,
      SPEED_MAX: 190,
      RADIUS_MIN: 12,
      RADIUS_MAX: 22,
      SCORE_PER_KILL: 10,
    },

    BOSS: {
      MAX_HP: 100,
      BONUS_SCORE: 500,
      BULLET_INTERVAL: 0.72,
      BULLET_SPEED: 210,
      CONTACT_DAMAGE: 1,
    },

    STARS: { COUNT: 90 },

    DIFFICULTY_RAMP: 0.014, // spawn interval shrinks by this fraction per second
  };

  // ---------------------------------------------------------------
  // DOM refs
  // ---------------------------------------------------------------
  const root      = document.getElementById('driftbreaker-root');
  const canvas    = document.getElementById('gameCanvas');
  const ctx       = canvas.getContext('2d');
  const hud       = document.getElementById('hud');
  const hudScore  = document.getElementById('hudScore');
  const hudLives  = document.getElementById('hudLives');
  const introOv   = document.getElementById('introOverlay');
  const endOv     = document.getElementById('endOverlay');
  const tapToPlay = document.getElementById('tapToPlay');
  const retryBtn  = document.getElementById('retryBtn');
  const endScoreEl= document.getElementById('endScore');
  const endBestEl = document.getElementById('endBest');
  const endTitle  = document.getElementById('endTitle');
  const endEyebrow= document.getElementById('endEyebrow');
  const flashEl = document.getElementById('flash');
  const bossHud = document.getElementById('bossHud');
  const bossHealthEl = document.getElementById('bossHealth');
  const bossHealthText = document.getElementById('bossHealthText');
  const victoryCopy = document.getElementById('victoryCopy');
  const unlockNote = document.getElementById('unlockNote');
  const proceedBtn = document.getElementById('proceedBtn');

  // ---------------------------------------------------------------
  // Canvas sizing (handles hiDPI + responsive container)
  // ---------------------------------------------------------------
  let W = 0, H = 0, DPR = 1;
  function resize(){
    const rect = root.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------------------------------------------------------
  // Input module — unifies pointer + touch + keyboard
  // ---------------------------------------------------------------
  const Input = (function(){
    const pointer = { x: null, y: null, active:false };
    const keys = {};

    function toLocal(clientX, clientY){
      const r = canvas.getBoundingClientRect();
      return { x: clientX - r.left, y: clientY - r.top };
    }

    root.addEventListener('pointerdown', e=>{
      pointer.active = true;
      const p = toLocal(e.clientX, e.clientY);
      pointer.x = p.x; pointer.y = p.y;
    });
    root.addEventListener('pointermove', e=>{
      if(!pointer.active && e.pointerType === 'mouse'){
        // allow hover-steer on desktop even without pressing
        const p = toLocal(e.clientX, e.clientY);
        pointer.x = p.x; pointer.y = p.y;
        return;
      }
      if(!pointer.active) return;
      const p = toLocal(e.clientX, e.clientY);
      pointer.x = p.x; pointer.y = p.y;
    });
    window.addEventListener('pointerup', ()=> pointer.active = false);

    window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup',   e=>{ keys[e.key.toLowerCase()] = false; });

    return {
      getPointer(){ return pointer; },
      getKeys(){ return keys; },
    };
  })();

  // ---------------------------------------------------------------
  // Starfield — decorative parallax background
  // ---------------------------------------------------------------
  class Starfield{
    constructor(count){
      this.stars = Array.from({length: count}, () => this.spawnStar(true));
    }
    spawnStar(randomY){
      return {
        x: Math.random() * W,
        y: randomY ? Math.random() * H : -4,
        r: Math.random() * 1.6 + 0.3,
        speed: Math.random() * 40 + 20,
        tw: Math.random() * Math.PI * 2,
      };
    }
    update(dt){
      for(const s of this.stars){
        s.y += s.speed * dt;
        s.tw += dt * 2;
        if(s.y > H){ Object.assign(s, this.spawnStar(false)); }
      }
    }
    draw(ctx){
      for(const s of this.stars){
        const alpha = 0.5 + Math.sin(s.tw) * 0.4;
        ctx.globalAlpha = Math.max(0.15, alpha);
        ctx.fillStyle = '#cfe0ff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // ---------------------------------------------------------------
  // Entities
  // ---------------------------------------------------------------
  class Player{
    constructor(){
      this.x = W/2; this.y = H*0.78;
      this.r = CONFIG.PLAYER.RADIUS;
      this.cooldown = 0;
      this.invuln = 0;
    }
    update(dt, target){
      if(target){
        this.x += (target.x - this.x) * CONFIG.PLAYER.FOLLOW_EASE;
        this.y += (target.y - this.y) * CONFIG.PLAYER.FOLLOW_EASE;
      }
      const keys = Input.getKeys();
      const kSpeed = 340 * dt;
      if(keys['arrowleft']  || keys['a']) this.x -= kSpeed;
      if(keys['arrowright'] || keys['d']) this.x += kSpeed;
      if(keys['arrowup']    || keys['w']) this.y -= kSpeed;
      if(keys['arrowdown']  || keys['s']) this.y += kSpeed;

      this.x = Math.max(this.r+4, Math.min(W-this.r-4, this.x));
      this.y = Math.max(this.r+4, Math.min(H-this.r-4, this.y));

      if(this.cooldown > 0) this.cooldown -= dt;
      if(this.invuln > 0) this.invuln -= dt;
    }
    canFire(){ return this.cooldown <= 0; }
    fire(){ this.cooldown = CONFIG.PLAYER.FIRE_COOLDOWN; }
    draw(ctx){
      const flicker = this.invuln > 0 && Math.floor(this.invuln*16)%2===0;
      if(flicker) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      const grd = ctx.createRadialGradient(0,-4,2,0,0,this.r*2.4);
      grd.addColorStop(0, 'rgba(63,240,208,0.55)');
      grd.addColorStop(1, 'rgba(63,240,208,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(0,0,this.r*2.4,0,Math.PI*2); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, -this.r*1.3);
      ctx.lineTo(this.r*0.9, this.r*0.9);
      ctx.lineTo(0, this.r*0.45);
      ctx.lineTo(-this.r*0.9, this.r*0.9);
      ctx.closePath();
      ctx.fillStyle = '#eafffb';
      ctx.strokeStyle = '#3ff0d0';
      ctx.lineWidth = 1.5;
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  class Bullet{
    constructor(x,y,vy,friendly,vx=0){
      this.x=x; this.y=y; this.vy=vy; this.vx=vx; this.friendly=friendly;
      this.r = friendly ? 3.2 : 3.6;
      this.dead=false;
    }
    update(dt){
      this.x += this.vx*dt;
      this.y += this.vy*dt;
      if(this.y < -20 || this.y > H+20 || this.x < -20 || this.x > W+20) this.dead = true;
    }
    draw(ctx){
      ctx.fillStyle = this.friendly ? '#9ffff0' : '#ff8fae';
      ctx.shadowColor = this.friendly ? '#3ff0d0' : '#ff3f8f';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  class Enemy{
    constructor(){
      this.r = CONFIG.ENEMY.RADIUS_MIN + Math.random()*(CONFIG.ENEMY.RADIUS_MAX-CONFIG.ENEMY.RADIUS_MIN);
      this.x = this.r + Math.random()*(W - this.r*2);
      this.y = -this.r - 10;
      this.speed = CONFIG.ENEMY.SPEED_MIN + Math.random()*(CONFIG.ENEMY.SPEED_MAX-CONFIG.ENEMY.SPEED_MIN);
      this.hp = this.r > 17 ? 2 : 1;
      this.wobble = Math.random()*Math.PI*2;
      this.dead = false;
    }
    update(dt){
      this.y += this.speed*dt;
      this.wobble += dt*3;
      this.x += Math.sin(this.wobble)*0.6;
      if(this.y - this.r > H) this.dead = true;
    }
    hit(){
      this.hp -= 1;
      return this.hp <= 0;
    }
    draw(ctx){
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.wobble*0.15);
      ctx.fillStyle = this.hp > 1 ? '#4a2e73' : '#2a1a4d';
      ctx.strokeStyle = '#ff3f8f';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      const spikes = 5;
      for(let i=0;i<spikes;i++){
        const a = (i/spikes)*Math.PI*2;
        const rad = i%2===0 ? this.r : this.r*0.6;
        const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
        i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }


  class Boss{
    constructor(){
      this.maxHp = CONFIG.BOSS.MAX_HP;
      this.hp = this.maxHp;
      this.x = W/2;
      this.y = H*0.18;
      this.r = 45;
      this.t = 0;
      this.fireTimer = CONFIG.BOSS.BULLET_INTERVAL;
      this.dead = false;
    }

    update(dt){
      this.t += dt;
      this.x = W/2 + Math.sin(this.t * 0.8) * Math.min(W*0.27, 105);
      this.fireTimer -= dt;

      if(this.fireTimer <= 0){
        this.fireTimer = CONFIG.BOSS.BULLET_INTERVAL * (0.82 + Math.random()*0.36);
        const dx = this.playerTargetX() - this.x;
        const dy = this.playerTargetY() - this.y;
        const len = Math.hypot(dx,dy) || 1;
        Game.enemyBullets.push(new Bullet(
          this.x, this.y + this.r*0.65,
          (dy/len) * CONFIG.BOSS.BULLET_SPEED,
          false,
          (dx/len) * CONFIG.BOSS.BULLET_SPEED
        ));
      }

      if(this.hp <= 0) this.dead = true;
    }

    playerTargetX(){ return Game.player ? Game.player.x : W/2; }
    playerTargetY(){ return Game.player ? Game.player.y : H*0.78; }

    hit(damage=1){
      this.hp = Math.max(0, this.hp - damage);
      UI.updateBoss(this.hp, this.maxHp);
      if(this.hp <= 0){
        this.dead = true;
        return true;
      }
      return false;
    }

    draw(ctx){
      ctx.save();
      ctx.translate(this.x, this.y);
      const pulse = 1 + Math.sin(this.t*4)*0.04;
      ctx.scale(pulse,pulse);

      const glow = ctx.createRadialGradient(0,0,4,0,0,this.r*2.2);
      glow.addColorStop(0,'rgba(255,63,143,0.28)');
      glow.addColorStop(1,'rgba(255,63,143,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(0,0,this.r*2.2,0,Math.PI*2); ctx.fill();

      ctx.fillStyle = '#170d2a';
      ctx.strokeStyle = '#ff3f8f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      const spikes = 10;
      for(let i=0;i<spikes;i++){
        const a = (i/spikes)*Math.PI*2 - Math.PI/2;
        const rad = i%2===0 ? this.r : this.r*0.62;
        const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
        i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#ffcf4d';
      ctx.shadowColor = '#ff3f8f';
      ctx.shadowBlur = 15;
      ctx.beginPath(); ctx.arc(0,0,9 + Math.sin(this.t*5)*1.5,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#eef1ff';
      ctx.beginPath(); ctx.arc(-15,-4,4,0,Math.PI*2); ctx.arc(15,-4,4,0,Math.PI*2); ctx.fill();

      ctx.restore();
    }
  }

  class Particle{
    constructor(x,y,color){
      this.x=x; this.y=y;
      const a = Math.random()*Math.PI*2, s = Math.random()*160+40;
      this.vx = Math.cos(a)*s; this.vy = Math.sin(a)*s;
      this.life = 0.5 + Math.random()*0.4;
      this.maxLife = this.life;
      this.color = color;
      this.r = Math.random()*2.2+1;
    }
    update(dt){
      this.x += this.vx*dt; this.y += this.vy*dt;
      this.vx *= 0.92; this.vy *= 0.92;
      this.life -= dt;
    }
    get dead(){ return this.life <= 0; }
    draw(ctx){
      ctx.globalAlpha = Math.max(0, this.life/this.maxLife);
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // ---------------------------------------------------------------
  // Game — state machine + main loop
  // ---------------------------------------------------------------
  const STATE = { INTRO:'intro', PLAYING:'playing', BOSS:'boss', END:'end', WIN:'win' };

  const Game = {
    state: STATE.INTRO,
    stars: new Starfield(CONFIG.STARS.COUNT),
    player: null,
    bullets: [],
    enemyBullets: [],
    enemies: [],
    particles: [],
    boss: null,
    score: 0,
    best: 0,
    lives: CONFIG.LIVES,
    timeLeft: CONFIG.DURATION_SEC,
    spawnTimer: 0,
    lastTs: 0,

    reset(){
      this.player = new Player();
      this.bullets = []; this.enemyBullets = []; this.enemies = []; this.particles = [];
      this.boss = null;
      UI.hideBoss();
      this.score = 0;
      this.lives = CONFIG.LIVES;
      this.timeLeft = CONFIG.DURATION_SEC; // internal clock only — not rendered in HUD
      this.spawnTimer = 0;
      UI.updateScore(0);
      UI.updateLives(this.lives);
    },

    start(){
      this.reset();
      this.state = STATE.PLAYING;
      UI.showPlaying();
    },

    end(reason){
      this.state = STATE.END;
      this.best = Math.max(this.best, this.score);
      UI.showEnd(reason, this.score, this.best);
    },

    spawnEnemy(){
      this.enemies.push(new Enemy());
    },

    startBoss(){
      this.state = STATE.BOSS;
      this.boss = new Boss();
      this.enemies = [];
      this.enemyBullets = [];
      UI.showBoss();
      UI.updateBoss(this.boss.hp, this.boss.maxHp);
    },

    win(){
      this.state = STATE.WIN;
      this.score += CONFIG.BOSS.BONUS_SCORE;
      this.best = Math.max(this.best, this.score);
      this.boss = null;
      this.enemyBullets = [];
      UI.showWin(this.score, this.best);
      window.__driftbreakerUnlocked = true;
      window.dispatchEvent(new CustomEvent('driftbreaker:unlocked', {
        detail:{ score:this.score, best:this.best }
      }));
    },

    explode(x,y,color,count){
      for(let i=0;i<count;i++) this.particles.push(new Particle(x,y,color));
    },

    update(dt){
      this.stars.update(dt);
      if(this.state === STATE.BOSS){
        this.updateBoss(dt);
        return;
      }
      if(this.state !== STATE.PLAYING) return;

      // internal clock — drives difficulty & the 60s cutoff, never shown to the player
      this.timeLeft -= dt;
      if(this.timeLeft <= 0){
        this.timeLeft = 0;
        this.startBoss();
        return;
      }

      // difficulty ramp
      const elapsed = CONFIG.DURATION_SEC - this.timeLeft;
      const interval = Math.max(
        CONFIG.ENEMY.MIN_SPAWN_INTERVAL,
        CONFIG.ENEMY.BASE_SPAWN_INTERVAL * (1 - elapsed*CONFIG.DIFFICULTY_RAMP)
      );
      this.spawnTimer -= dt;
      if(this.spawnTimer <= 0){
        this.spawnEnemy();
        this.spawnTimer = interval * (0.7 + Math.random()*0.6);
      }

      // player
      const p = Input.getPointer();
      const target = (p.x!=null) ? {x:p.x, y:p.y} : null;
      this.player.update(dt, target);
      if(this.player.canFire()){
        this.player.fire();
        this.bullets.push(new Bullet(this.player.x, this.player.y - this.player.r, -CONFIG.PLAYER.BULLET_SPEED, true));
      }

      // bullets
      for(const b of this.bullets) b.update(dt);
      this.bullets = this.bullets.filter(b=>!b.dead);

      // enemies
      for(const e of this.enemies) e.update(dt);

      // bullet-enemy collisions
      for(const b of this.bullets){
        for(const e of this.enemies){
          if(e.dead) continue;
          const dx=b.x-e.x, dy=b.y-e.y;
          if(dx*dx+dy*dy < (e.r+b.r)*(e.r+b.r)){
            b.dead = true;
            if(e.hit()){
              e.dead = true;
              this.score += CONFIG.ENEMY.SCORE_PER_KILL;
              UI.updateScore(this.score);
              this.explode(e.x, e.y, '#ff3f8f', 14);
            } else {
              this.explode(b.x,b.y,'#9ffff0',4);
            }
            break;
          }
        }
      }
      this.bullets = this.bullets.filter(b=>!b.dead);

      // enemy-player collisions
      if(this.player.invuln <= 0){
        for(const e of this.enemies){
          if(e.dead) continue;
          const dx=this.player.x-e.x, dy=this.player.y-e.y;
          if(dx*dx+dy*dy < (e.r+this.player.r)*(e.r+this.player.r)){
            e.dead = true;
            this.lives -= 1;
            this.player.invuln = CONFIG.PLAYER.INVULN_AFTER_HIT;
            UI.updateLives(this.lives);
            this.explode(this.player.x, this.player.y, '#3ff0d0', 20);
            UI.flash();
            if(this.lives <= 0){
              this.end('destroyed');
              return;
            }
            break;
          }
        }
      }

      this.enemies = this.enemies.filter(e=>!e.dead);

      // particles
      for(const pt of this.particles) pt.update(dt);
      this.particles = this.particles.filter(pt=>!pt.dead);
    },


    updateBoss(dt){
      if(!this.boss || !this.player) return;

      this.player.update(dt, Input.getPointer().x != null ? {
        x:Input.getPointer().x, y:Input.getPointer().y
      } : null);

      if(this.player.canFire()){
        this.player.fire();
        this.bullets.push(new Bullet(
          this.player.x, this.player.y - this.player.r,
          -CONFIG.PLAYER.BULLET_SPEED, true
        ));
      }

      this.boss.update(dt);

      for(const b of this.bullets) b.update(dt);
      this.bullets = this.bullets.filter(b=>!b.dead);

      for(const b of this.enemyBullets) b.update(dt);
      this.enemyBullets = this.enemyBullets.filter(b=>!b.dead);

      for(const b of this.bullets){
        if(!this.boss || this.boss.dead) break;
        const dx=b.x-this.boss.x, dy=b.y-this.boss.y;
        if(dx*dx+dy*dy < (this.boss.r+b.r)*(this.boss.r+b.r)){
          b.dead = true;
          this.explode(b.x,b.y,'#9ffff0',4);
          if(this.boss.hit(1)){
            this.explode(this.boss.x,this.boss.y,'#ff3f8f',55);
            UI.flash();
            this.win();
            return;
          }
        }
      }

      this.bullets = this.bullets.filter(b=>!b.dead);

      if(this.player.invuln <= 0){
        for(const b of this.enemyBullets){
          const dx=this.player.x-b.x, dy=this.player.y-b.y;
          if(dx*dx+dy*dy < (this.player.r+b.r)*(this.player.r+b.r)){
            b.dead=true;
            this.lives -= CONFIG.BOSS.CONTACT_DAMAGE;
            this.player.invuln = CONFIG.PLAYER.INVULN_AFTER_HIT;
            UI.updateLives(this.lives);
            this.explode(this.player.x,this.player.y,'#3ff0d0',20);
            UI.flash();
            if(this.lives <= 0){
              this.end('destroyed');
              return;
            }
            break;
          }
        }
      }
      this.enemyBullets = this.enemyBullets.filter(b=>!b.dead);

      // The boss can also hurt the ship by contact.
      if(this.player.invuln <= 0 && this.boss){
        const dx=this.player.x-this.boss.x, dy=this.player.y-this.boss.y;
        if(dx*dx+dy*dy < (this.player.r+this.boss.r)*(this.player.r+this.boss.r)){
          this.player.invuln = CONFIG.PLAYER.INVULN_AFTER_HIT;
          this.lives -= CONFIG.BOSS.CONTACT_DAMAGE;
          UI.updateLives(this.lives);
          this.explode(this.player.x,this.player.y,'#3ff0d0',20);
          UI.flash();
          if(this.lives <= 0){
            this.end('destroyed');
            return;
          }
        }
      }
    },

    draw(){
      ctx.clearRect(0,0,W,H);
      this.stars.draw(ctx);
      if(this.state === STATE.PLAYING || this.state === STATE.END || this.state === STATE.BOSS || this.state === STATE.WIN){
        for(const e of this.enemies) e.draw(ctx);
        for(const b of this.bullets) b.draw(ctx);
        for(const b of this.enemyBullets) b.draw(ctx);
        for(const pt of this.particles) pt.draw(ctx);
        if(this.boss) this.boss.draw(ctx);
        if(this.player) this.player.draw(ctx);
      }
    },

    loop(ts){
      if(!this.lastTs) this.lastTs = ts;
      let dt = (ts - this.lastTs)/1000;
      dt = Math.min(dt, 0.05); // clamp to avoid spiral of death on tab-switch
      this.lastTs = ts;

      this.update(dt);
      this.draw();

      requestAnimationFrame(this.loop.bind(this));
    }
  };

  // ---------------------------------------------------------------
  // UI — DOM glue, kept separate from canvas/game logic
  // ---------------------------------------------------------------
  const UI = {
    updateScore(v){ hudScore.textContent = v; },
    updateLives(n){
      hudLives.innerHTML = '';
      for(let i=0;i<CONFIG.LIVES;i++){
        const dot = document.createElement('span');
        dot.className = 'life-dot' + (i < n ? '' : ' spent');
        hudLives.appendChild(dot);
      }
    },
    showPlaying(){
      introOv.classList.add('hidden');
      endOv.classList.add('hidden');
      hud.classList.add('visible');
      this.hideBoss();
      victoryCopy.textContent = '';
      unlockNote.textContent = '';
      proceedBtn.style.display = 'none';
    },
    showBoss(){
      hud.classList.add('visible');
      bossHud.classList.add('visible');
    },
    hideBoss(){
      bossHud.classList.remove('visible');
    },
    updateBoss(hp, maxHp){
      const pct = Math.max(0, Math.min(1, hp/maxHp));
      bossHealthEl.style.transform = `scaleX(${pct})`;
      bossHealthText.textContent = `${Math.ceil(pct*100)}%`;
    },
    showEnd(reason, score, best){
      this.hideBoss();
      hud.classList.remove('visible');
      endEyebrow.textContent = reason === 'destroyed' ? 'Hull Breached' : 'Run Complete';
      endTitle.textContent   = reason === 'destroyed' ? 'Ship Lost' : 'Sector Cleared';
      endScoreEl.textContent = score;
      endBestEl.textContent  = best;
      victoryCopy.textContent = reason === 'destroyed'
        ? 'The run ended before the final threat was neutralized.'
        : '';
      unlockNote.textContent = '';
      proceedBtn.style.display = 'none';
      endOv.classList.remove('hidden');
    },
    showWin(score, best){
      this.hideBoss();
      hud.classList.remove('visible');
      endEyebrow.textContent = 'Final Boss Defeated';
      endTitle.textContent = 'YOU WON';
      endScoreEl.textContent = score;
      endBestEl.textContent = best;
      victoryCopy.innerHTML = 'The Void Warden is down. <strong>You survived the 60-second drift.</strong>';
      unlockNote.innerHTML = 'The next section of the website is now <strong>UNLOCKED</strong>. You are allowed to proceed.<br>Proceed with caution — the next section might cause excessive happiness.';
      retryBtn.textContent = 'Fly Again';
      proceedBtn.style.display = 'inline-block';
      endOv.classList.remove('hidden');
    },
    showIntro(){
      endOv.classList.add('hidden');
      hud.classList.remove('visible');
      this.hideBoss();
      introOv.classList.remove('hidden');
    },
    flash(){
      flashEl.style.transition = 'none';
      flashEl.style.opacity = '0.5';
      requestAnimationFrame(()=>{
        flashEl.style.transition = 'opacity .3s ease';
        flashEl.style.opacity = '0';
      });
    }
  };

  // ---------------------------------------------------------------
  // Wire up start / retry
  // ---------------------------------------------------------------
  function beginRun(){
    if(Game.state === STATE.PLAYING) return;
    Game.start();
  }
  tapToPlay.addEventListener('pointerdown', beginRun);
  retryBtn.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); beginRun(); });

  proceedBtn.addEventListener('pointerdown', (e)=>{
    e.stopPropagation();
    window.dispatchEvent(new CustomEvent('driftbreaker:proceed', {
      detail:{ unlocked:true, score:Game.score, best:Game.best }
    }));

    const next = document.querySelector('#next-section, #nextSection, .next-section');
    if(next){
      next.hidden = false;
      next.scrollIntoView({behavior:'smooth', block:'start'});
    } else {
      proceedBtn.textContent = 'Next Section Unlocked ✓';
    }
  });

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  Game.player = new Player();
  requestAnimationFrame(Game.loop.bind(Game));

})();
</script>
</body>
</html>
