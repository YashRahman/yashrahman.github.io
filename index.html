<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DRIFTBREAKER — 60s Space Run</title>
<style>
  :root{
    --void-0:#05060c;
    --void-1:#0b0f1e;
    --void-2:#141a30;
    --nebula:#5b3fb8;
    --cyan:#3ff0d0;
    --magenta:#ff3f8f;
    --amber:#ffcf4d;
    --ink-0:#eef1ff;
    --ink-1:#8b93b8;
    --font-display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'Space Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--void-0);}
  body{
    font-family:var(--font-display);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    color:var(--ink-0);
    height:100dvh; 
  }


  #driftbreaker-root{
    position:relative;

    width:min(520px, 100vw, calc(100dvh * 9 / 16));
    aspect-ratio:9/16;
    background:
      radial-gradient(ellipse at 30% 15%, rgba(91,63,184,0.35), transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(63,240,208,0.10), transparent 50%),
      linear-gradient(180deg, var(--void-1) 0%, var(--void-0) 100%);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,0.06), 0 30px 80px -20px rgba(0,0,0,0.8);
    user-select:none;
    touch-action:none;
    container-type:inline-size; 
  }

  canvas#gameCanvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
  }


  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:max(14px, env(safe-area-inset-top)) 16px 0;
    pointer-events:none;
    opacity:0; transition:opacity .3s ease;
    z-index:5;
  }
  #hud.visible{opacity:1;}
  .hud-block{
    display:flex; flex-direction:column; gap:2px;
  }
  .hud-label{
    font-family:var(--font-mono);
    font-size:9px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-1);
  }
  .hud-value{
    font-size:20px; font-weight:700; letter-spacing:.02em;
    color:var(--ink-0);
    text-shadow:0 0 12px rgba(63,240,208,0.35);
  }
  #hud .score .hud-value{ color:var(--cyan); text-align:right;}
  #hud .lives{ align-items:flex-end; }
  .life-dot{
    display:inline-block; width:9px; height:9px; margin-left:4px;
    border-radius:50%; background:var(--magenta);
    box-shadow:0 0 8px rgba(255,63,143,.7);
  }
  .life-dot.spent{ background:transparent; box-shadow:none; border:1px solid rgba(255,255,255,.15); }

  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(91,63,184,0.4), transparent 60%),
      rgba(5,6,12,0.72);
    backdrop-filter:blur(3px);
    z-index:10;
    transition:opacity .35s ease, visibility .35s ease;
  }
  .overlay.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

  .eyebrow{
    font-family:var(--font-mono); font-size:clamp(10px,3.2cqw,12px); letter-spacing:.35em;
    text-transform:uppercase; color:var(--cyan); margin-bottom:10px;
    text-shadow:0 0 10px rgba(63,240,208,.5);
  }
  .title{
    font-size:clamp(26px,10cqw,44px); font-weight:800; letter-spacing:.02em;
    margin:0 0 8px; line-height:1.05;
    background:linear-gradient(180deg,#ffffff, #b9c2ff 70%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{
    font-family:var(--font-mono); font-size:clamp(11px,3.4cqw,13px); color:var(--ink-1);
    max-width:85%; line-height:1.6; margin-bottom:28px;
  }

  .tap-pulse{
    display:inline-flex; align-items:center; gap:10px;
    padding:14px 30px;
    border-radius:100px;
    border:1px solid rgba(63,240,208,.5);
    background:rgba(63,240,208,0.08);
    color:var(--cyan);
    font-family:var(--font-mono);
    font-size:13px; letter-spacing:.2em; text-transform:uppercase;
    animation:pulse 1.8s ease-in-out infinite;
    cursor:pointer;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(63,240,208,.35); transform:scale(1); }
    50%{ box-shadow:0 0 0 10px rgba(63,240,208,0); transform:scale(1.03); }
  }

  .stat-row{
    display:flex; gap:28px; margin:6px 0 26px;
  }
  .stat{ display:flex; flex-direction:column; align-items:center; }
  .stat .n{ font-size:28px; font-weight:800; color:var(--ink-0); }
  .stat .n.best{ color:var(--amber); }
  .stat .l{ font-family:var(--font-mono); font-size:9px; letter-spacing:.18em; color:var(--ink-1); text-transform:uppercase; margin-top:4px; }

  .retry-btn{
    padding:13px 34px;
    border-radius:100px;
    border:none;
    background:linear-gradient(135deg,var(--cyan),#2bb8ff);
    color:#04141a;
    font-family:var(--font-display); font-weight:700; font-size:14px; letter-spacing:.04em;
    cursor:pointer;
    box-shadow:0 8px 24px -6px rgba(63,240,208,.5);
    transition:transform .15s ease;
  }
  .retry-btn:active{ transform:scale(.96); }

  .hint{
    position:absolute; bottom:14px; left:0; right:0;
    text-align:center; font-family:var(--font-mono); font-size:10px;
    letter-spacing:.12em; color:var(--ink-1); opacity:.7;
  }

  #flash{
    position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:8;
  }
</style>
</head>
<body>

<div id="driftbreaker-root">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-block lives">
      <span class="hud-label">Hull</span>
      <span class="hud-value" id="hudLives"></span>
    </div>
    <div class="hud-block score">
      <span class="hud-label">Score</span>
      <span class="hud-value" id="hudScore">0</span>
    </div>
  </div>

  <div id="flash"></div>


  <div class="overlay" id="introOverlay">
    <div class="eyebrow">Sector 7 // Incoming</div>
    <h1 class="title">DRIFTBREAKER</h1>
    <p class="sub">Drag or move to steer. Your cannons fire on their own.<br>Survive the 60-second drift. Every wreck is points.</p>
    <div class="tap-pulse" id="tapToPlay">▶ Tap to Play</div>
  </div>


  <div class="overlay hidden" id="endOverlay">
    <div class="eyebrow" id="endEyebrow">Run Complete</div>
    <h1 class="title" id="endTitle">Sector Cleared</h1>
    <div class="stat-row">
      <div class="stat"><span class="n" id="endScore">0</span><span class="l">Score</span></div>
      <div class="stat"><span class="n best" id="endBest">0</span><span class="l">Best (session)</span></div>
    </div>
    <button class="retry-btn" id="retryBtn">Fly Again</button>
  </div>

  <div class="hint">move to steer · auto-fire armed</div>
</div>

<script>
(function(){
  "use strict";

  const CONFIG = {
    DURATION_SEC: 60,
    LIVES: 3,

    PLAYER: {
      RADIUS: 14,
      FOLLOW_EASE: 0.22,      
      FIRE_COOLDOWN: 0.16,    
      BULLET_SPEED: 620,
      INVULN_AFTER_HIT: 1.4,
    },

    ENEMY: {
      BASE_SPAWN_INTERVAL: 1.05,   
      MIN_SPAWN_INTERVAL: 0.35,
      SPEED_MIN: 90,
      SPEED_MAX: 190,
      RADIUS_MIN: 12,
      RADIUS_MAX: 22,
      SCORE_PER_KILL: 10,
    },

    STARS: { COUNT: 90 },

    DIFFICULTY_RAMP: 0.014, 
  };


  const root      = document.getElementById('driftbreaker-root');
  const canvas    = document.getElementById('gameCanvas');
  const ctx       = canvas.getContext('2d');
  const hud       = document.getElementById('hud');
  const hudScore  = document.getElementById('hudScore');
  const hudLives  = document.getElementById('hudLives');
  const introOv   = document.getElementById('introOverlay');
  const endOv     = document.getElementById('endOverlay');
  const tapToPlay = document.getElementById('tapToPlay');
  const retryBtn  = document.getElementById('retryBtn');
  const endScoreEl= document.getElementById('endScore');
  const endBestEl = document.getElementById('endBest');
  const endTitle  = document.getElementById('endTitle');
  const endEyebrow= document.getElementById('endEyebrow');
  const flashEl   = document.getElementById('flash');


  let W = 0, H = 0, DPR = 1;
  function resize(){
    const rect = root.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();


  const Input = (function(){
    const pointer = { x: null, y: null, active:false };
    const keys = {};

    function toLocal(clientX, clientY){
      const r = canvas.getBoundingClientRect();
      return { x: clientX - r.left, y: clientY - r.top };
    }

    root.addEventListener('pointerdown', e=>{
      pointer.active = true;
      const p = toLocal(e.clientX, e.clientY);
      pointer.x = p.x; pointer.y = p.y;
    });
    root.addEventListener('pointermove', e=>{
      if(!pointer.active && e.pointerType === 'mouse'){

        const p = toLocal(e.clientX, e.clientY);
        pointer.x = p.x; pointer.y = p.y;
        return;
      }
      if(!pointer.active) return;
      const p = toLocal(e.clientX, e.clientY);
      pointer.x = p.x; pointer.y = p.y;
    });
    window.addEventListener('pointerup', ()=> pointer.active = false);

    window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup',   e=>{ keys[e.key.toLowerCase()] = false; });

    return {
      getPointer(){ return pointer; },
      getKeys(){ return keys; },
    };
  })();


  class Starfield{
    constructor(count){
      this.stars = Array.from({length: count}, () => this.spawnStar(true));
    }
    spawnStar(randomY){
      return {
        x: Math.random() * W,
        y: randomY ? Math.random() * H : -4,
        r: Math.random() * 1.6 + 0.3,
        speed: Math.random() * 40 + 20,
        tw: Math.random() * Math.PI * 2,
      };
    }
    update(dt){
      for(const s of this.stars){
        s.y += s.speed * dt;
        s.tw += dt * 2;
        if(s.y > H){ Object.assign(s, this.spawnStar(false)); }
      }
    }
    draw(ctx){
      for(const s of this.stars){
        const alpha = 0.5 + Math.sin(s.tw) * 0.4;
        ctx.globalAlpha = Math.max(0.15, alpha);
        ctx.fillStyle = '#cfe0ff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  class Player{
    constructor(){
      this.x = W/2; this.y = H*0.78;
      this.r = CONFIG.PLAYER.RADIUS;
      this.cooldown = 0;
      this.invuln = 0;
    }
    update(dt, target){
      if(target){
        this.x += (target.x - this.x) * CONFIG.PLAYER.FOLLOW_EASE;
        this.y += (target.y - this.y) * CONFIG.PLAYER.FOLLOW_EASE;
      }
      const keys = Input.getKeys();
      const kSpeed = 340 * dt;
      if(keys['arrowleft']  || keys['a']) this.x -= kSpeed;
      if(keys['arrowright'] || keys['d']) this.x += kSpeed;
      if(keys['arrowup']    || keys['w']) this.y -= kSpeed;
      if(keys['arrowdown']  || keys['s']) this.y += kSpeed;

      this.x = Math.max(this.r+4, Math.min(W-this.r-4, this.x));
      this.y = Math.max(this.r+4, Math.min(H-this.r-4, this.y));

      if(this.cooldown > 0) this.cooldown -= dt;
      if(this.invuln > 0) this.invuln -= dt;
    }
    canFire(){ return this.cooldown <= 0; }
    fire(){ this.cooldown = CONFIG.PLAYER.FIRE_COOLDOWN; }
    draw(ctx){
      const flicker = this.invuln > 0 && Math.floor(this.invuln*16)%2===0;
      if(flicker) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      const grd = ctx.createRadialGradient(0,-4,2,0,0,this.r*2.4);
      grd.addColorStop(0, 'rgba(63,240,208,0.55)');
      grd.addColorStop(1, 'rgba(63,240,208,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(0,0,this.r*2.4,0,Math.PI*2); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, -this.r*1.3);
      ctx.lineTo(this.r*0.9, this.r*0.9);
      ctx.lineTo(0, this.r*0.45);
      ctx.lineTo(-this.r*0.9, this.r*0.9);
      ctx.closePath();
      ctx.fillStyle = '#eafffb';
      ctx.strokeStyle = '#3ff0d0';
      ctx.lineWidth = 1.5;
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  class Bullet{
    constructor(x,y,vy,friendly){
      this.x=x; this.y=y; this.vy=vy; this.friendly=friendly;
      this.r = friendly ? 3.2 : 3.6;
      this.dead=false;
    }
    update(dt){
      this.y += this.vy*dt;
      if(this.y < -20 || this.y > H+20) this.dead = true;
    }
    draw(ctx){
      ctx.fillStyle = this.friendly ? '#9ffff0' : '#ff8fae';
      ctx.shadowColor = this.friendly ? '#3ff0d0' : '#ff3f8f';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  class Enemy{
    constructor(){
      this.r = CONFIG.ENEMY.RADIUS_MIN + Math.random()*(CONFIG.ENEMY.RADIUS_MAX-CONFIG.ENEMY.RADIUS_MIN);
      this.x = this.r + Math.random()*(W - this.r*2);
      this.y = -this.r - 10;
      this.speed = CONFIG.ENEMY.SPEED_MIN + Math.random()*(CONFIG.ENEMY.SPEED_MAX-CONFIG.ENEMY.SPEED_MIN);
      this.hp = this.r > 17 ? 2 : 1;
      this.wobble = Math.random()*Math.PI*2;
      this.dead = false;
    }
    update(dt){
      this.y += this.speed*dt;
      this.wobble += dt*3;
      this.x += Math.sin(this.wobble)*0.6;
      if(this.y - this.r > H) this.dead = true;
    }
    hit(){
      this.hp -= 1;
      return this.hp <= 0;
    }
    draw(ctx){
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.wobble*0.15);
      ctx.fillStyle = this.hp > 1 ? '#4a2e73' : '#2a1a4d';
      ctx.strokeStyle = '#ff3f8f';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      const spikes = 5;
      for(let i=0;i<spikes;i++){
        const a = (i/spikes)*Math.PI*2;
        const rad = i%2===0 ? this.r : this.r*0.6;
        const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
        i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  class Particle{
    constructor(x,y,color){
      this.x=x; this.y=y;
      const a = Math.random()*Math.PI*2, s = Math.random()*160+40;
      this.vx = Math.cos(a)*s; this.vy = Math.sin(a)*s;
      this.life = 0.5 + Math.random()*0.4;
      this.maxLife = this.life;
      this.color = color;
      this.r = Math.random()*2.2+1;
    }
    update(dt){
      this.x += this.vx*dt; this.y += this.vy*dt;
      this.vx *= 0.92; this.vy *= 0.92;
      this.life -= dt;
    }
    get dead(){ return this.life <= 0; }
    draw(ctx){
      ctx.globalAlpha = Math.max(0, this.life/this.maxLife);
      ctx.fillStyle = this.color;
      ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }


  const STATE = { INTRO:'intro', PLAYING:'playing', END:'end' };

  const Game = {
    state: STATE.INTRO,
    stars: new Starfield(CONFIG.STARS.COUNT),
    player: null,
    bullets: [],
    enemyBullets: [],
    enemies: [],
    particles: [],
    score: 0,
    best: 0,
    lives: CONFIG.LIVES,
    timeLeft: CONFIG.DURATION_SEC,
    spawnTimer: 0,
    lastTs: 0,

    reset(){
      this.player = new Player();
      this.bullets = []; this.enemies = []; this.particles = [];
      this.score = 0;
      this.lives = CONFIG.LIVES;
      this.timeLeft = CONFIG.DURATION_SEC; 
      this.spawnTimer = 0;
      UI.updateScore(0);
      UI.updateLives(this.lives);
    },

    start(){
      this.reset();
      this.state = STATE.PLAYING;
      UI.showPlaying();
    },

    end(reason){
      this.state = STATE.END;
      this.best = Math.max(this.best, this.score);
      UI.showEnd(reason, this.score, this.best);
    },

    spawnEnemy(){
      this.enemies.push(new Enemy());
    },

    explode(x,y,color,count){
      for(let i=0;i<count;i++) this.particles.push(new Particle(x,y,color));
    },

    update(dt){
      this.stars.update(dt);
      if(this.state !== STATE.PLAYING) return;


      this.timeLeft -= dt;
      if(this.timeLeft <= 0){
        this.timeLeft = 0;
        this.end('time');
        return;
      }


      const elapsed = CONFIG.DURATION_SEC - this.timeLeft;
      const interval = Math.max(
        CONFIG.ENEMY.MIN_SPAWN_INTERVAL,
        CONFIG.ENEMY.BASE_SPAWN_INTERVAL * (1 - elapsed*CONFIG.DIFFICULTY_RAMP)
      );
      this.spawnTimer -= dt;
      if(this.spawnTimer <= 0){
        this.spawnEnemy();
        this.spawnTimer = interval * (0.7 + Math.random()*0.6);
      }


      const p = Input.getPointer();
      const target = (p.x!=null) ? {x:p.x, y:p.y} : null;
      this.player.update(dt, target);
      if(this.player.canFire()){
        this.player.fire();
        this.bullets.push(new Bullet(this.player.x, this.player.y - this.player.r, -CONFIG.PLAYER.BULLET_SPEED, true));
      }


      for(const b of this.bullets) b.update(dt);
      this.bullets = this.bullets.filter(b=>!b.dead);


      for(const e of this.enemies) e.update(dt);

      for(const b of this.bullets){
        for(const e of this.enemies){
          if(e.dead) continue;
          const dx=b.x-e.x, dy=b.y-e.y;
          if(dx*dx+dy*dy < (e.r+b.r)*(e.r+b.r)){
            b.dead = true;
            if(e.hit()){
              e.dead = true;
              this.score += CONFIG.ENEMY.SCORE_PER_KILL;
              UI.updateScore(this.score);
              this.explode(e.x, e.y, '#ff3f8f', 14);
            } else {
              this.explode(b.x,b.y,'#9ffff0',4);
            }
            break;
          }
        }
      }
      this.bullets = this.bullets.filter(b=>!b.dead);

      if(this.player.invuln <= 0){
        for(const e of this.enemies){
          if(e.dead) continue;
          const dx=this.player.x-e.x, dy=this.player.y-e.y;
          if(dx*dx+dy*dy < (e.r+this.player.r)*(e.r+this.player.r)){
            e.dead = true;
            this.lives -= 1;
            this.player.invuln = CONFIG.PLAYER.INVULN_AFTER_HIT;
            UI.updateLives(this.lives);
            this.explode(this.player.x, this.player.y, '#3ff0d0', 20);
            UI.flash();
            if(this.lives <= 0){
              this.end('destroyed');
              return;
            }
            break;
          }
        }
      }

      this.enemies = this.enemies.filter(e=>!e.dead);

      for(const pt of this.particles) pt.update(dt);
      this.particles = this.particles.filter(pt=>!pt.dead);
    },

    draw(){
      ctx.clearRect(0,0,W,H);
      this.stars.draw(ctx);
      if(this.state === STATE.PLAYING || this.state === STATE.END){
        for(const e of this.enemies) e.draw(ctx);
        for(const b of this.bullets) b.draw(ctx);
        for(const pt of this.particles) pt.draw(ctx);
        if(this.player) this.player.draw(ctx);
      }
    },

    loop(ts){
      if(!this.lastTs) this.lastTs = ts;
      let dt = (ts - this.lastTs)/1000;
      dt = Math.min(dt, 0.05); 
      this.lastTs = ts;

      this.update(dt);
      this.draw();

      requestAnimationFrame(this.loop.bind(this));
    }
  };

  const UI = {
    updateScore(v){ hudScore.textContent = v; },
    updateLives(n){
      hudLives.innerHTML = '';
      for(let i=0;i<CONFIG.LIVES;i++){
        const dot = document.createElement('span');
        dot.className = 'life-dot' + (i < n ? '' : ' spent');
        hudLives.appendChild(dot);
      }
    },
    showPlaying(){
      introOv.classList.add('hidden');
      endOv.classList.add('hidden');
      hud.classList.add('visible');
    },
    showEnd(reason, score, best){
      hud.classList.remove('visible');
      endEyebrow.textContent = reason === 'destroyed' ? 'Hull Breached' : 'Run Complete';
      endTitle.textContent   = reason === 'destroyed' ? 'Ship Lost' : 'Sector Cleared';
      endScoreEl.textContent = score;
      endBestEl.textContent  = best;
      endOv.classList.remove('hidden');
    },
    showIntro(){
      endOv.classList.add('hidden');
      hud.classList.remove('visible');
      introOv.classList.remove('hidden');
    },
    flash(){
      flashEl.style.transition = 'none';
      flashEl.style.opacity = '0.5';
      requestAnimationFrame(()=>{
        flashEl.style.transition = 'opacity .3s ease';
        flashEl.style.opacity = '0';
